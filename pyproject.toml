[project]
name = "cprog-phygame"
version = "0.1.0"
description = "CPROG PHYGAME - Isometric zombie survival game"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame-ce==2.5.8",
    "numpy==2.5.4",
]

# Optional GPU validation for the GLSL passes in shaders/. The game fully
# falls back to the NumPy post-processing pipeline when ModernGL is
# missing or no GL context is available, so this is not required.
[project.optional-dependencies]
gl = [
    "moderngl>=5.11",
]

[project.scripts]
phygame = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "entities", "systems", "ui", "world",
           "graphics", "shaders", "tests"]
